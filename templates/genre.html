{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white rounded-3xl p-8 border border-border-main shadow-soft space-y-6">

        <div class="border-b border-border-main pb-6">
            <span class="px-2.5 py-1 text-[10px] font-bold uppercase rounded-md bg-card-cream text-fg-main border border-border-main inline-block mb-2">Gatunek</span>
            <h1 class="text-2xl md:text-3xl font-bold text-fg-main tracking-tight">{{ genre.name }}</h1>
        </div>

        {% if current_user and current_user.admin == 2 and genre.id != 1 %}
        <div class="pt-4 border-t border-border-main mt-6">
            <button onclick="document.getElementById('deleteGenreModal').classList.remove('hidden')" class="px-4 py-2 bg-red-50 text-red-600 border border-red-100 rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-red-100 transition-colors cursor-pointer">🗑️ Usuń gatunek</button>
        </div>

        <div id="deleteGenreModal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/20 backdrop-blur-sm transition-all" onclick="if(event.target === this) this.classList.add('hidden')">
            <div class="relative w-full max-w-md mx-4 bg-white rounded-3xl p-6 shadow-xl border border-border-main" onclick="event.stopPropagation();">
                <h3 class="text-lg font-bold text-fg-main mb-2">Decyzja o powiązanych pozycjach</h3>
                <form action="/delete_genre/{{ genre.id }}" method="POST" class="space-y-3 m-0">
                    <label class="flex items-center gap-3 p-3 bg-slate-50 border border-border-main rounded-xl cursor-pointer">
                        <input type="radio" name="mode" value="set_unknown" checked>
                        <span class="text-xs font-bold text-fg-main">Ustaw jako "Nieznane"</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-red-50/30 border border-red-100 rounded-xl cursor-pointer">
                        <input type="radio" name="mode" value="cascade">
                        <span class="text-xs font-bold text-red-600">Usuń trwale wszystkie książki</span>
                    </label>
                    <div class="flex gap-3 pt-3 mt-4">
                        <button type="button" onclick="document.getElementById('deleteGenreModal').classList.add('hidden')" class="flex-1 h-10 text-xs font-bold bg-gray-100 rounded-xl">Anuluj</button>
                        <button type="submit" class="flex-1 h-10 text-xs font-bold bg-red-500 text-white rounded-xl">Potwierdź</button>
                    </div>
                </form>
            </div>
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}
